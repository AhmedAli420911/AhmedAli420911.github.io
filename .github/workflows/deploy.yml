name: Redirect GitHub Pages to servicecaptureco.com

# The site is served by the Cloudflare Worker in cloudflare/ at
# https://servicecaptureco.com. This Pages site only forwards visitors there so
# no duplicate copy of the website stays online at *.github.io.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build the redirect site
        run: |
          mkdir -p _site
          # Same page for / and every unknown path (404.html), so deep links keep their path.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Service Capture Co. has moved</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://servicecaptureco.com/">
          <meta http-equiv="refresh" content="0; url=https://servicecaptureco.com/">
          <script>location.replace("https://servicecaptureco.com" + location.pathname + location.search + location.hash);</script>
          </head>
          <body>
          <p>Service Capture Co. is now at <a href="https://servicecaptureco.com/">servicecaptureco.com</a>.</p>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
