  grid-template-columns: 1fr 1fr;
  gap: 20px 25px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.scope-section li {
  display: flex;
  align-items: start;
  gap: 10px;
  font-size: 14px;
}
.scope-section svg {
  color: #17659d;
  margin-top: 4px;
}
.scope-note {
  border-top: 1px solid #dce4eb;
  padding-top: 24px;
  font-size: 13px;
  line-height: 1.9;
}
.back-link {
  margin-bottom: 28px;
  color: #17659d;
}
.simulation-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 30px;
}
.simulation-heading h1 {
  font-size: 36px;
  letter-spacing: -1px;
}
.simulation-heading p:not(.eyebrow) {
  margin-top: 17px;
  font-size: 16px;
}
.simulation-tag {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  font-size: 12px;
  white-space: nowrap;
  color: #526579;
  border: 1px solid #cbd5df;
  border-radius: 20px;
  padding: 7px 12px;
}
.simulation-grid {
  display: grid;
  grid-template-columns: 310px minmax(0,1fr);
  gap: 25px;
  align-items: start;
}
.simulation-settings {
  border: 1px solid #dce4eb;
  background: white;
  border-radius: 9px;
  padding: 25px;
}
.simulation-settings h2 {
  font-size: 22px;
  margin-bottom: 24px;
  letter-spacing: -.4px;
}
.simulation-settings>.field {
  margin-top: 20px;
}
.simulation-settings .choice {
  white-space: normal;
  font-size: 13px;
}
.route-explainer {
  font-size: 13px;
  margin-top: 17px;
  line-height: 1.8;
}
.caller-card {
  background: #f5f7fa;
  border-radius: 6px;
  padding: 18px;
  margin-top: 24px;
}
.caller-card>span:first-child {
  font-size: 12px;
  color: #63788b;
}
.caller-card h3 {
  margin: 8px 0;
  font-size: 19px;
}
.caller-card p {
  font-size: 14px;
}
.caller-card .badge {
  margin-top: 12px;
}
.simulation-footnote {
  font-size: 12px;
  line-height: 1.8;
  margin: 20px 0;
}
.simulation-settings>.btn {
  width: 100%;
  font-size: 13px;
  padding: 12px;
}
.conversation-panel {
  background: white;
  border: 1px solid #dce4eb;
  border-radius: 9px;
  overflow: hidden;
}
.conversation-header {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 21px 25px;
  border-bottom: 1px solid #dce4eb;
}
.conversation-header h2 {
  font-size: 18px;
  letter-spacing: -.2px;
}
.conversation-header p {
  font-size: 12px;
  margin-top: 5px;
}
.conversation {
  padding: 26px;
  display: flex;
  flex-direction: column;
  gap: 21px;
}
.conversation-empty {
  padding: 60px 20px;
  text-align: center;
}
.conversation-empty svg {
  margin: 0 auto 22px;
  color: #1479c9;
}
.conversation-empty h3 {
  font-size: 22px;
}
.conversation-empty p {
  font-size: 15px;
  margin: 16px auto 0;
  max-width: 320px;
}
.chat-turn {
  max-width: 91%;
  align-self: flex-start;
}
.chat-turn>span {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 7px;
  color: #63788b;
}
.chat-turn p {
  padding: 16px 18px;
  border-radius: 0 10px 10px;
  background: #edf3f8;
  color: #334e68;
  font-size: 15px;
  line-height: 1.8;
}
.chat-turn.caller {
  align-self: flex-end;
}
.chat-turn.caller>span {
  text-align: right;
}
.chat-turn.caller p {
  background: #102a43;
  color: #e9eff4;
  border-radius: 10px 0 10px 10px;
}
.call-result {
  margin-top: 30px;
  border: 1px solid #cadfd4;
  border-radius: 10px;
  background: white;
  padding: 32px;
}
.result-heading {
  display: flex;
  align-items: center;
  gap: 18px;
}
.result-heading>svg {
  color: #28734f;
}
.result-heading .eyebrow {
  color: #28734f;
  margin-bottom: 8px;
}
.result-heading h2 {
  font-size: 27px;
}
.result-heading p:last-child {
  font-size: 12px;
  margin-top: 8px;
  font-family: monospace;
}
.result-summary {
  font-size: 16px;
  margin: 25px 0;
  line-height: 1.85;
  max-width: 930px;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 24px 30px;
}
.summary-grid dt {
  font-size: 12px;
  color: #63788b;
}
.summary-grid dd {
  font-size: 14px;
  margin-top: 5px;
  overflow-wrap: anywhere;
}
.next-action {
  margin: 27px 0 18px;
  border-top: 1px solid #dce4eb;
  padding-top: 23px;
}
.next-action strong {
  font-size: 14px;
}
.next-action p {
  font-size: 16px;
  margin-top: 8px;
}
.result-meta {
  font-size: 12px;
  margin-bottom: 22px;
}
.inquiry-stats {
  grid-template-columns: repeat(6,minmax(0,1fr));
}
.inquiry-stats article {
  padding: 20px;
}
.urgent-stat {
  border-top: 3px solid #cf8438 !important;
}
.tracker-actions {
  display: flex;
  gap: 23px;
  align-items: center;
}
.tracker-actions .text-link {
  font-size: 13px;
}
.inquiry-filters {
  gap: 12px;
}
.inquiry-filters .field {
  width: 180px;
}
.inquiry-filters .field:last-child {
  width: 150px;
}
.inquiry-filters .search-field {
  min-width: 220px;
}
.inquiry-filters input {
  font-size: 13px;
}
.inquiry-filters .choice {
  font-size: 13px;
}
.inquiry-filters .field label {
  font-size: 12px;
}
.urgency-urgent {
  background: #fff0db;
  color: #8a5000;
  border: 1px solid #e9bd83;
}
.urgency-standard {
  background: #f2f5f8;
  color: #526579;
}
.urgent-row {
  background: #fffbf5;
}
.urgent-row td:first-child {
  border-left: 3px solid #d89948;
}
.urgent-card {
  border-left: 3px solid #d89948 !important;
}
.action-cell {
  max-width: 200px;
  line-height: 1.55;
}
.inquiry-filters+.desktop-table td {
  font-size: 13px;
}
.mobile-next-action {
  margin-top: 12px !important;
  line-height: 1.7;
}
.mobile-leads article>.badge {
  margin-top: 10px;
}
.empty .btn {
  margin-top: 18px;
}
.detail-routing {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px 14px;
}
.detail-routing .choice {
  font-size: 13px;
}
.next-action-editor textarea {
  margin: 0 !important;
}
.next-action-editor .view-btn {
  margin: 3px 0 18px;
}
.transcript-details {
  border-top: 1px solid #dce4eb;
  border-bottom: 1px solid #dce4eb;
  margin: 22px 0;
}
.transcript-details [data-slot=accordion-trigger] {
  font-size: 15px;
}
.transcript-text>div {
  padding: 13px;
  background: #f5f7fa;
  border-radius: 5px;
  margin-bottom: 10px;
}
.transcript-text strong {
  font-size: 12px;
}
.transcript-text p {
  font-size: 14px;
  line-height: 1.8;
  margin-top: 5px;
}
.simulation-settings .choice [data-slot=select-value] {
  white-space: normal;
  line-clamp: unset;
  -webkit-line-clamp: unset;
}
.simulation-settings .choice {
  height: auto !important;
  min-height: 48px !important;
}
@media (max-width:1150px) {
  .source-cards {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
  .source-cards article {
    padding: 25px;
  }
  .scope-section {
    gap: 40px;
  }
  .inquiry-stats {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
  .inquiry-filters {
    flex-wrap: wrap;
  }
  .inquiry-filters .search-field {
    flex-basis: 100%;
  }
  .inquiry-filters .field {
    flex: 1;
    width: auto;
  }
  .after-hours-strip>.wrap {
    flex-wrap: wrap;
  }
  .after-hours-strip>.wrap>div {
    flex: 1;
    min-width: 300px;
  }
  .after-hours-strip .btn {
    margin-left: 77px;
  }
}
@media (max-width:850px) {
  .owner-heading h1 {
    font-size: 35px;
  }
  .scope-section {
    grid-template-columns: 1fr;
    gap: 30px;
  }
  .simulation-grid {
    grid-template-columns: 270px minmax(0,1fr);
    gap: 18px;
  }
  .simulation-settings {
    padding: 20px;
  }
  .simulation-heading h1 {
    font-size: 31px;
  }
  .simulation-tag {
    display: none;
  }
  .conversation {
    padding: 20px;
  }
  .chat-turn {
    max-width: 100%;
  }
  .chat-turn p {
    font-size: 14px;
    padding: 14px;
  }
  .conversation-header {
    padding: 18px;
  }
  .conversation-header .source-icon {
    display: none;
  }
  .summary-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
  .tracker-actions {
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
  }
  .workflow-steps strong {
    font-size: 14px;
  }
  .workflow-heading {
    align-items: start;
  }
  .workflow-heading>span {
    max-width: 120px;
  }
  .simulation-grid {
    grid-template-columns: 260px minmax(0,1fr);
  }
}
@media (max-width:600px) {
  .demo-banner {
    gap: 4px 6px;
    padding: 8px 15px;
  }
  .demo-banner>span {
    font-size: 11px;
    flex: 1;
  }
  .demo-banner a {
    display: inline-flex;
    margin-left: 0;
    font-size: 12px;
    flex-basis: 100%;
    justify-content: center;
  }
  .after-hours-strip>.wrap {
    gap: 17px;
    padding-top: 30px;
    padding-bottom: 30px;
  }
  .after-hours-strip>.wrap>div {
    min-width: 0;
    flex-basis: 100%;
  }
  .after-hours-strip .source-icon {
    display: none;
  }
  .after-hours-strip .btn {
    margin-left: 0;
  }
  .after-hours-strip h2 {
    font-size: 26px;
  }
  .after-hours-strip p {
    font-size: 16px;
  }
  .business-page,.simulation-page {
    padding-top: 33px;
  }
  .owner-heading h1 {
    font-size: 32px;
    letter-spacing: -.8px;
  }
  .owner-heading>p:not(.eyebrow) {
    font-size: 16px;
  }
  .system-label {
    font-size: 13px;
  }
  .source-cards {
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 28px;
  }
  .source-cards h2 {
    font-size: 21px;
    margin-top: 18px;
  }
  .source-cards p {
    font-size: 16px;
  }
  .source-cards .text-link {
    font-size: 14px;
  }
  .workflow-panel {
    padding: 23px 20px;
  }
  .workflow-heading {
    display: block;
  }
  .workflow-heading h2 {
    font-size: 24px;
  }
  .workflow-heading>span {
    display: block;
    max-width: none;
    margin-top: 13px;
  }
  .workflow-steps {
    grid-template-columns: 1fr;
    margin-top: 25px;
  }
  .workflow-steps li {
    min-height: 65px;
  }
  .workflow-steps strong {
    font-size: 15px;
  }
  .workflow-steps svg {
    transform: rotate(90deg);
  }
  .workflow-note {
    font-size: 15px;
  }
  .workflow-panel .button-row {
    align-items: stretch;
    gap: 14px;
  }
  .workflow-panel .btn {
    width: 100%;
    font-size: 13px;
  }
  .scope-section {
    padding-top: 40px;
  }
  .scope-section h2 {
    font-size: 27px;
  }
  .scope-section ul {
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .scope-section li {
    font-size: 15px;
  }
  .scope-note {
    font-size: 13px;
  }
  .simulation-heading h1 {
    font-size: 30px;
  }
  .simulation-heading .eyebrow {
    font-size: 9px;
  }
  .simulation-heading p:not(.eyebrow) {
    font-size: 15px;
  }
  .simulation-grid {
    grid-template-columns: 1fr;
  }
  .simulation-settings {
    padding: 23px;
  }
  .simulation-settings .choice {
    font-size: 15px;
  }
  .caller-card {
    margin-top: 20px;
  }
  .route-explainer {
    font-size: 14px;
  }
  .simulation-footnote {
    font-size: 13px;
  }
  .simulation-settings>.btn {
    font-size: 14px;
  }
  .conversation-header h2 {
    font-size: 19px;
  }
  .chat-turn p {
    font-size: 15px;
  }
  .conversation-empty {
    padding: 35px 0;
  }
  .call-result {
    padding: 24px 20px;
  }
  .result-heading {
    align-items: start;
    gap: 13px;
  }
  .result-heading h2 {
    font-size: 24px;
  }
  .result-heading>svg {
    margin-top: 20px;
  }
  .summary-grid {
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .summary-grid dd {
    font-size: 15px;
  }
  .call-result>.btn {
    width: 100%;
    font-size: 13px;
  }
  .tracker-actions {
    flex-direction: row;
    align-items: center;
    margin-top: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .tracker-actions .btn {
    margin-top: 0;
  }
  .inquiry-stats {
    grid-template-columns: 1fr 1fr;
  }
  .inquiry-stats article:first-child {
    grid-column: auto;
    display: block;
  }
  .inquiry-stats span {
    font-size: 13px;
  }
  .inquiry-stats article {
    padding: 18px;
  }
  .inquiry-filters .field,.inquiry-filters .field:last-child {
    width: 100%;
  }
  .inquiry-filters .choice {
    font-size: 15px;
  }
  .inquiry-filters .field label {
    font-size: 14px;
  }
  .detail-routing {
    grid-template-columns: 1fr;
  }
  .detail-routing .choice {
    font-size: 15px;
  }
  .manual-sheet .estimate-form {
    padding: 10px 22px 30px;
  }
  .back-link {
    font-size: 14px;
    margin-bottom: 25px;
  }
}
main:focus,.call-result:focus {
  outline: none;
}
.call-result {
  scroll-margin-top: 115px;
}
